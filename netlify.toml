[build]
  publish = "."

# ecudrive.ro fără www este adresa principală
[[redirects]]
  from = "https://www.ecudrive.ro/*"
  to = "https://ecudrive.ro/:splat"
  status = 301
  force = true

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/blog/posts.json"
  [headers.values]
    Cache-Control = "no-cache"
