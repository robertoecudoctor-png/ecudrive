[build]
  publish = "."

# ecudrive.ro fără www este adresa principală
[[redirects]]
  from = "https://www.ecudrive.ro/*"
  to = "https://ecudrive.ro/:splat"
  status = 301
  force = true

# Link scurt pentru recenzii (pe cardul cu QR). Când profilul Google e confirmat,
# schimbă "to" cu linkul de recenzie Google; cardurile tipărite rămân valabile.
[[redirects]]
  from = "/recenzie"
  to = "https://www.facebook.com/ecudrive/reviews"
  status = 302
  force = true

[[headers]]
  for = "/card-recenzie.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/blog/posts.json"
  [headers.values]
    Cache-Control = "no-cache"
